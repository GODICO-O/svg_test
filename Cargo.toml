[package]
name = "gd_launcher_test"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_ui",
    "tonemapping_luts",
    # Fitur android_shared_stdcxx & android-game-activity dihapus karena sudah bawaan internal Bevy 0.19
] }
bevy_svg = "0.19"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["game-activity"] }
android_logger = "0.15"
log = "0.4"
