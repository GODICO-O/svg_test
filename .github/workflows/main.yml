name: Build SVG Test APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK + platforms
        run: |
          SdkMgr="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SdkMgr" --licenses > /dev/null || true
          "$SdkMgr" --install "platforms;android-30" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Generate temporary debug keystore
        run: |
          rm -f debug.keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Optimized Release APK with cargo-apk
        run: cargo apk build --profile release
        env:
          RUSTFLAGS: '-C link-arg=-Wl,-z,max-page-size=16384'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: svg-test-optimized-release-apk
          path: "**/target/**/*.apk"
