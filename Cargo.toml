[package]
name = "gd_launcher_test"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
name = "gd_launcher_test"

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_ui",
    "tonemapping_luts",
    "zstd_rust",
] }
bevy_svg = "0.19"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["game-activity"] }
android_logger = "0.15"
log = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
